<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>AI App Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- LEFT -->
  <div class="left">
    <h1>Crie apps com IA<br>em 30 segundos</h1>

    <textarea id="prompt" placeholder="Ex: app de vendas com comissão automática..."></textarea>

    <div class="suggestions">
      <button onclick="setPrompt('App de vendas')">App de vendas</button>
      <button onclick="setPrompt('Sistema financeiro')">Sistema financeiro</button>
      <button onclick="setPrompt('Delivery simples')">Delivery</button>
      <button onclick="setPrompt('CRM básico')">CRM</button>
    </div>

    <button class="generate" onclick="generateApp()">Gerar aplicativo</button>
  </div>

  <!-- RIGHT -->
  <div class="right" id="preview">
    <div class="empty">
      <h2>Preview em tempo real</h2>
      <p>Seu app aparecerá aqui</p>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
